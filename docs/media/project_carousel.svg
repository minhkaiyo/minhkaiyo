<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 200" width="1000" height="200">
  <defs>
    <!-- ClipPath để bo góc cho từng card ảnh -->
    <clipPath id="card-clip">
      <rect x="0" y="0" width="320" height="180" rx="16" ry="16" />
    </clipPath>
    <!-- Gradient phủ mờ nhẹ ở đáy card để làm nổi bật text -->
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0D1117" stop-opacity="0" />
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0.85" />
    </linearGradient>
  </defs>

  <style>
    .marquee-track {
      display: flex;
      /* Animation dịch chuyển ngang vô tận */
      animation: marquee 30s linear infinite;
    }

    /* Di chuyển đúng 1700px (chiều rộng của 5 cards kèm khoảng cách) rồi reset */
    @keyframes marquee {
      0% {
        transform: translateX(0px);
      }
      100% {
        transform: translateX(-1700px);
      }
    }

    .project-card {
      transition: transform 0.2s ease;
    }

    .project-title {
      font-family: 'JetBrains Mono', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 14px;
      font-weight: 700;
      fill: #FFFFFF;
    }

    .project-tech {
      font-family: 'JetBrains Mono', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 10px;
      font-weight: 600;
      fill: #06B6D4;
    }
  </style>

  <!-- Track chứa dải băng chuyền ảnh -->
  <g class="marquee-track">
    <!-- ==================== CHU KỲ CHÍNH (5 CARDS) ==================== -->
    <!-- Card 1: Ocean Love -->
    <g class="project-card" transform="translate(0, 10)">
      <g clip-path="url(#card-clip)">
        <image href="https://raw.githubusercontent.com/minhkaiyo/minhkaiyo/main/docs/media/ocean_love.png" width="320" height="180" preserveAspectRatio="xMidYMid slice" />
        <rect x="0" y="110" width="320" height="70" fill="url(#card-grad)" />
        <text x="15" y="145" class="project-title">🌊 Ocean Love</text>
        <text x="15" y="162" class="project-tech">Three.js • WebGL • Boids</text>
      </g>
    </g>

    <!-- Card 2: Love Galaxy -->
    <g class="project-card" transform="translate(340, 10)">
      <g clip-path="url(#card-clip)">
        <image href="https://raw.githubusercontent.com/minhkaiyo/minhkaiyo/main/docs/media/love_galaxy.png" width="320" height="180" preserveAspectRatio="xMidYMid slice" />
        <rect x="0" y="110" width="320" height="70" fill="url(#card-grad)" />
        <text x="15" y="145" class="project-title">🌌 project-love-galaxy</text>
        <text x="15" y="162" class="project-tech">JS • HTML5 Canvas Physics</text>
      </g>
    </g>

    <!-- Card 3: FPGA-ESP32 IoT Hub -->
    <g class="project-card" transform="translate(680, 10)">
      <g clip-path="url(#card-clip)">
        <image href="https://raw.githubusercontent.com/minhkaiyo/minhkaiyo/main/docs/media/fpga_esp32.png" width="320" height="180" preserveAspectRatio="xMidYMid slice" />
        <rect x="0" y="110" width="320" height="70" fill="url(#card-grad)" />
        <text x="15" y="145" class="project-title">🌐 FPGA-ESP32 IoT Hub</text>
        <text x="15" y="162" class="project-tech">Verilog • SPI • Firebase</text>
      </g>
    </g>

    <!-- Card 4: Knowledge OS -->
    <g class="project-card" transform="translate(1020, 10)">
      <g clip-path="url(#card-clip)">
        <image href="https://raw.githubusercontent.com/minhkaiyo/minhkaiyo/main/docs/media/knowledge_os.png" width="320" height="180" preserveAspectRatio="xMidYMid slice" />
        <rect x="0" y="110" width="320" height="70" fill="url(#card-grad)" />
        <text x="15" y="145" class="project-title">🧠 Knowledge OS</text>
        <text x="15" y="162" class="project-tech">React • D3.js Force Layout</text>
      </g>
    </g>

    <!-- Card 5: EcoCollect -->
    <g class="project-card" transform="translate(1360, 10)">
      <g clip-path="url(#card-clip)">
        <image href="https://raw.githubusercontent.com/minhkaiyo/minhkaiyo/main/docs/media/ecocollect.png" width="320" height="180" preserveAspectRatio="xMidYMid slice" />
        <rect x="0" y="110" width="320" height="70" fill="url(#card-grad)" />
        <text x="15" y="145" class="project-title">♻️ EcoCollect</text>
        <text x="15" y="162" class="project-tech">Flutter • Firebase Ecosystem</text>
      </g>
    </g>

    <!-- ==================== CHU KỲ LẶP LẠI (SAO CHÉP ĐỂ SEAMLESS SCROLL) ==================== -->
    <!-- Card 1' -->
    <g class="project-card" transform="translate(1700, 10)">
      <g clip-path="url(#card-clip)">
        <image href="https://raw.githubusercontent.com/minhkaiyo/minhkaiyo/main/docs/media/ocean_love.png" width="320" height="180" preserveAspectRatio="xMidYMid slice" />
        <rect x="0" y="110" width="320" height="70" fill="url(#card-grad)" />
        <text x="15" y="145" class="project-title">🌊 Ocean Love</text>
        <text x="15" y="162" class="project-tech">Three.js • WebGL • Boids</text>
      </g>
    </g>

    <!-- Card 2' -->
    <g class="project-card" transform="translate(2040, 10)">
      <g clip-path="url(#card-clip)">
        <image href="https://raw.githubusercontent.com/minhkaiyo/minhkaiyo/main/docs/media/love_galaxy.png" width="320" height="180" preserveAspectRatio="xMidYMid slice" />
        <rect x="0" y="110" width="320" height="70" fill="url(#card-grad)" />
        <text x="15" y="145" class="project-title">🌌 project-love-galaxy</text>
        <text x="15" y="162" class="project-tech">JS • HTML5 Canvas Physics</text>
      </g>
    </g>

    <!-- Card 3' -->
    <g class="project-card" transform="translate(2380, 10)">
      <g clip-path="url(#card-clip)">
        <image href="https://raw.githubusercontent.com/minhkaiyo/minhkaiyo/main/docs/media/fpga_esp32.png" width="320" height="180" preserveAspectRatio="xMidYMid slice" />
        <rect x="0" y="110" width="320" height="70" fill="url(#card-grad)" />
        <text x="15" y="145" class="project-title">🌐 FPGA-ESP32 IoT Hub</text>
        <text x="15" y="162" class="project-tech">Verilog • SPI • Firebase</text>
      </g>
    </g>

    <!-- Card 4' -->
    <g class="project-card" transform="translate(2720, 10)">
      <g clip-path="url(#card-clip)">
        <image href="https://raw.githubusercontent.com/minhkaiyo/minhkaiyo/main/docs/media/knowledge_os.png" width="320" height="180" preserveAspectRatio="xMidYMid slice" />
        <rect x="0" y="110" width="320" height="70" fill="url(#card-grad)" />
        <text x="15" y="145" class="project-title">🧠 Knowledge OS</text>
        <text x="15" y="162" class="project-tech">React • D3.js Force Layout</text>
      </g>
    </g>

    <!-- Card 5' -->
    <g class="project-card" transform="translate(3060, 10)">
      <g clip-path="url(#card-clip)">
        <image href="https://raw.githubusercontent.com/minhkaiyo/minhkaiyo/main/docs/media/ecocollect.png" width="320" height="180" preserveAspectRatio="xMidYMid slice" />
        <rect x="0" y="110" width="320" height="70" fill="url(#card-grad)" />
        <text x="15" y="145" class="project-title">♻️ EcoCollect</text>
        <text x="15" y="162" class="project-tech">Flutter • Firebase Ecosystem</text>
      </g>
    </g>
  </g>
</svg>
