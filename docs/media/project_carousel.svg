<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3000 600" width="3000" height="600">
  <defs>
    <!-- ClipPath để bo góc lớn chất lượng cao cho từng card ảnh -->
    <clipPath id="card-clip">
      <rect x="0" y="0" width="960" height="540" rx="36" ry="36" />
    </clipPath>
    <!-- Gradient phủ mờ ở đáy card giúp hiển thị text sắc nét -->
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0D1117" stop-opacity="0" />
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0.9" />
    </linearGradient>
  </defs>

  <style>
    .marquee-track {
      display: flex;
      /* Tăng độ mượt mà của chuyển động trượt */
      animation: marquee 35s linear infinite;
    }

    /* Trượt đúng 5100px (tổng chiều rộng 5 cards HD kèm gap) rồi lặp lại */
    @keyframes marquee {
      0% {
        transform: translateX(0px);
      }
      100% {
        transform: translateX(-5100px);
      }
    }

    .project-title {
      font-family: 'JetBrains Mono', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 38px;
      font-weight: 700;
      fill: #FFFFFF;
    }

    .project-tech {
      font-family: 'JetBrains Mono', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 20px;
      font-weight: 600;
      fill: #06B6D4;
    }
  </style>

  <!-- Track chứa dải băng chuyền ảnh sử dụng đường dẫn tương đối để tương thích cả offline lẫn online -->
  <g class="marquee-track">
    <!-- ==================== CHU KỲ CHÍNH (5 CARDS HD) ==================== -->
    <!-- Card 1: Ocean Love -->
    <g transform="translate(0, 30)">
      <g clip-path="url(#card-clip)">
        <image href="ocean_love.png" width="960" height="540" preserveAspectRatio="xMidYMid slice" />
        <rect x="0" y="340" width="960" height="200" fill="url(#card-grad)" />
        <text x="40" y="445" class="project-title">🌊 Ocean Love</text>
        <text x="40" y="490" class="project-tech">Three.js • WebGL Shaders • Boids Simulation</text>
      </g>
    </g>

    <!-- Card 2: Love Galaxy -->
    <g transform="translate(1020, 30)">
      <g clip-path="url(#card-clip)">
        <image href="love_galaxy.png" width="960" height="540" preserveAspectRatio="xMidYMid slice" />
        <rect x="0" y="340" width="960" height="200" fill="url(#card-grad)" />
        <text x="40" y="445" class="project-title">🌌 project-love-galaxy</text>
        <text x="40" y="490" class="project-tech">Pure JS • HTML5 Canvas Physics • Math Engines</text>
      </g>
    </g>

    <!-- Card 3: FPGA-ESP32 IoT Hub -->
    <g transform="translate(2040, 30)">
      <g clip-path="url(#card-clip)">
        <image href="fpga_esp32.png" width="960" height="540" preserveAspectRatio="xMidYMid slice" />
        <rect x="0" y="340" width="960" height="200" fill="url(#card-grad)" />
        <text x="40" y="445" class="project-title">🌐 FPGA-ESP32 IoT Hub</text>
        <text x="40" y="490" class="project-tech">Verilog • SPI Protocol • Firebase • Web Dashboard</text>
      </g>
    </g>

    <!-- Card 4: Knowledge OS -->
    <g transform="translate(3060, 30)">
      <g clip-path="url(#card-clip)">
        <image href="knowledge_os.png" width="960" height="540" preserveAspectRatio="xMidYMid slice" />
        <rect x="0" y="340" width="960" height="200" fill="url(#card-grad)" />
        <text x="40" y="445" class="project-title">🧠 Knowledge OS</text>
        <text x="40" y="490" class="project-tech">React • D3.js Force Layout • Interactive Graph</text>
      </g>
    </g>

    <!-- Card 5: EcoCollect -->
    <g transform="translate(4080, 30)">
      <g clip-path="url(#card-clip)">
        <image href="ecocollect.png" width="960" height="540" preserveAspectRatio="xMidYMid slice" />
        <rect x="0" y="340" width="960" height="200" fill="url(#card-grad)" />
        <text x="40" y="445" class="project-title">♻️ EcoCollect</text>
        <text x="40" y="490" class="project-tech">Flutter • Firebase Services • Smart Recycling</text>
      </g>
    </g>

    <!-- ==================== CHU KỲ LẶP LẠI (SAO CHÉP ĐỂ SEAMLESS SCROLL) ==================== -->
    <!-- Card 1' -->
    <g transform="translate(5100, 30)">
      <g clip-path="url(#card-clip)">
        <image href="ocean_love.png" width="960" height="540" preserveAspectRatio="xMidYMid slice" />
        <rect x="0" y="340" width="960" height="200" fill="url(#card-grad)" />
        <text x="40" y="445" class="project-title">🌊 Ocean Love</text>
        <text x="40" y="490" class="project-tech">Three.js • WebGL Shaders • Boids Simulation</text>
      </g>
    </g>

    <!-- Card 2' -->
    <g transform="translate(6120, 30)">
      <g clip-path="url(#card-clip)">
        <image href="love_galaxy.png" width="960" height="540" preserveAspectRatio="xMidYMid slice" />
        <rect x="0" y="340" width="960" height="200" fill="url(#card-grad)" />
        <text x="40" y="445" class="project-title">🌌 project-love-galaxy</text>
        <text x="40" y="490" class="project-tech">Pure JS • HTML5 Canvas Physics • Math Engines</text>
      </g>
    </g>

    <!-- Card 3' -->
    <g transform="translate(7140, 30)">
      <g clip-path="url(#card-clip)">
        <image href="fpga_esp32.png" width="960" height="540" preserveAspectRatio="xMidYMid slice" />
        <rect x="0" y="340" width="960" height="200" fill="url(#card-grad)" />
        <text x="40" y="445" class="project-title">🌐 FPGA-ESP32 IoT Hub</text>
        <text x="40" y="490" class="project-tech">Verilog • SPI Protocol • Firebase • Web Dashboard</text>
      </g>
    </g>

    <!-- Card 4' -->
    <g transform="translate(8160, 30)">
      <g clip-path="url(#card-clip)">
        <image href="knowledge_os.png" width="960" height="540" preserveAspectRatio="xMidYMid slice" />
        <rect x="0" y="340" width="960" height="200" fill="url(#card-grad)" />
        <text x="40" y="445" class="project-title">🧠 Knowledge OS</text>
        <text x="40" y="490" class="project-tech">React • D3.js Force Layout • Interactive Graph</text>
      </g>
    </g>

    <!-- Card 5' -->
    <g transform="translate(9180, 30)">
      <g clip-path="url(#card-clip)">
        <image href="ecocollect.png" width="960" height="540" preserveAspectRatio="xMidYMid slice" />
        <rect x="0" y="340" width="960" height="200" fill="url(#card-grad)" />
        <text x="40" y="445" class="project-title">♻️ EcoCollect</text>
        <text x="40" y="490" class="project-tech">Flutter • Firebase Services • Smart Recycling</text>
      </g>
    </g>
  </g>
</svg>
